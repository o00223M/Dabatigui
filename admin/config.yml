backend:
  name: github
  repo: o00223m/Dabatigui
  branch: main
  auth_type: pkce
  app_id: Ov23liaWbEa1ymQEafGY

locale: fr
display_url: https://dabatiki.com

media_folder: "images"
public_folder: "/images"

collections:
  - name: "contenu"
    label: "Contenu du site"
    files:
      - name: "general"
        label: "Tout le contenu"
        file: "content.json"
        fields:
          - label: "Section Hero (Accueil)"
            name: "hero"
            widget: "object"
            fields:
              - label: "Badge (texte en haut)"
                name: "badge"
                widget: "string"
                hint: "Ex: Bamako, Mali · Afrique Francophone"
              - label: "Titre principal"
                name: "title"
                widget: "text"
                hint: "La grande phrase animée sur l'image"
              - label: "Sous-titre"
                name: "subtitle"
                widget: "text"
                hint: "Le texte descriptif sous le titre"

          - label: "Section Mission"
            name: "mission"
            widget: "object"
            fields:
              - label: "Paragraphe 1"
                name: "text1"
                widget: "text"
              - label: "Paragraphe 2"
                name: "text2"
                widget: "text"
              - label: "Nombre de paysans formés"
                name: "counter_farmers"
                widget: "number"
                value_type: "int"
              - label: "Nombre de régions couvertes"
                name: "counter_regions"
                widget: "number"
                value_type: "int"
              - label: "Années d'expertise"
                name: "counter_years"
                widget: "number"
                value_type: "int"

          - label: "Services (4 cartes)"
            name: "services"
            widget: "list"
            min: 4
            max: 4
            summary: "{{fields.title}}"
            fields:
              - label: "Icône (emoji)"
                name: "icon"
                widget: "string"
                hint: "Copiez-collez un emoji. Ex: 🌦️"
              - label: "Titre du service"
                name: "title"
                widget: "string"
              - label: "Description"
                name: "description"
                widget: "text"

          - label: "Section Partenaires"
            name: "partners"
            widget: "object"
            fields:
              - label: "Sous-titre"
                name: "subtitle"
                widget: "text"
              - label: "Arguments (4 points forts)"
                name: "arguments"
                widget: "list"
                min: 4
                max: 4
                field:
                  label: "Argument"
                  name: "item"
                  widget: "string"

          - label: "Contact"
            name: "contact"
            widget: "object"
            fields:
              - label: "Email"
                name: "email"
                widget: "string"
              - label: "Localisation"
                name: "location"
                widget: "string"
